name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: |
          mkdir -p www assets
          cp kjv-bible.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/share @capacitor/clipboard @capacitor/app
          npm install --save-dev @capacitor/assets
      - name: Create Android project
        run: |
          npx cap init "Bible" com.diego.kjvbible --web-dir=www
          npx cap add android
      - name: Generate icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kjv-bible-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
