<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bible</title>
<style>
:root{--bg:#f7f5ef;--ink:#1d2433;--mute:#5d6577;--line:#d9d5c8;--bar:#1d2b4a;--barink:#f7f5ef;--hl:#ffe9a8;--btn:#e9e5d6;box-sizing:border-box}
[data-theme=night]{--bg:#12161f;--ink:#e8d9b8;--mute:#9a97a0;--line:#2b3244;--bar:#0b0e15;--barink:#e8d9b8;--hl:#4a3d12;--btn:#232a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;touch-action:pan-y}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif","DejaVu Serif",serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:var(--btn);border:0;border-radius:10px;min-height:48px;min-width:48px;padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #3b7bd8;outline-offset:2px}
header{position:fixed;top:0;left:0;right:0;transition:transform .25s ease;z-index:5;display:flex;align-items:center;padding:8px 7px;background:var(--bar);color:var(--barink)}
header button{margin:0 3px;background:transparent;color:var(--barink);border:1px solid rgba(255,255,255,.3)}
#title{flex:1;min-width:0;font-size:1.15rem;font-weight:bold;text-align:left;border:0!important;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15}#title span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#title small{font-size:.68rem;font-weight:normal;opacity:.85;font-family:system-ui,sans-serif}
main{max-width:42rem;margin:0 auto;padding:84px 18px 120px}
body.hh header{transform:translateY(-130%)}
.chap{font-size:var(--fs,26px);line-height:1.6}.chap.lines .vs{display:block;margin:0 0 .7em}.chap.para .vs{display:inline}.chap.para sup{margin-left:.2em}.vs{-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-bottom:420px}
#read sup{font-size:.55em;color:var(--mute);margin-right:.35em;font-family:system-ui,sans-serif}
#read .vs.hl{background:var(--hl);border-radius:6px}
#read h1{font-size:1.6rem;margin:.2em 0 .8em}
.pager{display:flex;margin:32px 0 0}.pager button{flex:1;margin:0 9px;min-height:78px;font-size:1.1rem;line-height:1.35;font-weight:bold}.pager small{display:block;font-weight:normal;font-size:.85em;color:var(--mute)}
.panel{display:none}.panel.on{display:block}
.list button{display:block;width:100%;text-align:left;margin:0 0 6px;font-size:1.2rem;min-height:54px}
.list h2{font-size:1rem;color:var(--mute);margin:18px 0 8px;font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid button{font-size:1.2rem;min-height:60px;padding:0}
#q{width:100%;min-height:52px;font-size:1.2rem;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.res{display:block;width:100%;text-align:left;margin:8px 0 0;padding:10px 12px;min-height:0;line-height:1.45}
.res b{display:block;font-size:.95rem;color:var(--mute);font-family:system-ui,sans-serif}
mark{background:var(--hl);color:inherit;border-radius:3px}
.note{color:var(--mute);margin:12px 0}
#read{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#read .w.wp{background:var(--hl);border-radius:4px}
#read .vs.sel{background:var(--hl);border-radius:6px}
body.sh main{padding-bottom:70vh}
#sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:3px solid var(--bar);padding:12px 14px 14px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto}
#sheet.on{display:block}
.sh-t{font-weight:bold;font-size:1.1rem;margin:0 0 10px;text-align:center}
.big{display:block;width:100%;min-height:60px;margin:0 0 8px;font-size:1.25rem;font-weight:bold}
.big.close{background:var(--bar);color:var(--barink)}
#sheet .row{display:flex;margin:0 -4px}#sheet .row .big{margin:0 4px;flex:1}
#toast{display:none;position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:10;background:var(--bar);color:var(--barink);padding:12px 18px;border-radius:10px;font-size:1.1rem;font-family:system-ui,sans-serif}
#toast.on{display:block}
#hint{display:flex;align-items:center;background:var(--btn);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-family:system-ui,sans-serif}
#hint span{flex:1}#hint button{margin-left:10px}
.tabs{display:flex;margin:0 -4px 10px}.tabs .big{margin:0 4px;flex:1;min-height:52px;font-size:1.05rem}
.tabs .big.on{background:var(--bar);color:var(--barink)}
.def{max-height:40vh;overflow-y:auto;white-space:pre-wrap;line-height:1.5;font-size:calc(var(--fs,26px)*.8);margin:0 0 12px;padding:10px 12px;border:2px solid var(--line);border-radius:10px}
.def small{display:block;font-family:system-ui,sans-serif;color:var(--mute);font-size:.6em;margin-bottom:6px}
.vers{display:flex;flex-wrap:wrap;margin:0 -4px 12px}
.list .vers button{display:block;width:auto;flex:1 1 calc(50% - 8px);margin:0 4px 8px;min-height:68px;text-align:center;font-size:1.2rem;font-weight:bold}
.list .vers button.on{background:var(--bar);color:var(--barink)}
.vers small{display:block;font-weight:normal;font-size:.7em;margin-top:2px}
#read h1 small{font-size:.5em;color:var(--mute);font-family:system-ui,sans-serif;margin-left:.5em;font-weight:normal}
.dl{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);margin:6px 2px 4px}
#sheet .dsp .big{font-size:1.05rem;min-height:54px;line-height:1.2}
#sheet .dsp .row{margin:0 -4px 8px}
#sheet .big.on{background:var(--bar);color:var(--barink)}
.szv{flex:0 0 70px;text-align:center;line-height:54px;font-weight:bold;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Choose book and chapter">Books</button>
  <button id="title" aria-label="Choose book and chapter"></button>
  <button id="find" aria-label="Search">Search</button>
  <button id="disp" aria-label="Display settings: text size, theme, layout">Display</button>
</header>
<main>
  <section id="read" class="panel on"></section>
  <section id="nav" class="panel list"></section>
  <section id="search" class="panel">
    <input id="q" type="search" placeholder="Search words, e.g. shepherd" autocomplete="off">
    <div id="res"></div>
  </section>
</main>
<div id="sheet"></div><div id="toast"></div>
<script>
const NAMES=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
const VERS=[['kjv','KJV','King James Version'],['bsb','BSB','Berean Standard Bible'],['web','WEB','World English Bible'],['asv','ASV','American Standard Version']];
const BOOKS=NAMES.map(n=>[n,[]]);
const $=id=>document.getElementById(id);
const S={b:42,c:0,fs:26,theme:'day',hl:0,v:'kjv',layout:'lines',vn:true,ch:true};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
try{Object.assign(S,JSON.parse(store.get('kjv')||'{}'))}catch(e){}
S.hl=0;
if(!VERS.some(x=>x[0]===S.v))S.v='kjv';
if(!(S.b>=0&&S.b<66))S.b=42;
if(S.layout!=='para')S.layout='lines';S.vn=S.vn!==false;S.ch=S.ch!==false;
if(S.theme!=='night')S.theme='day';S.fs=Math.min(48,Math.max(16,+S.fs||26));
const save=()=>store.set('kjv',JSON.stringify({b:S.b,c:S.c,fs:S.fs,theme:S.theme,v:S.v,layout:S.layout,vn:S.vn,ch:S.ch}));
const VL=()=>VERS.find(x=>x[0]===S.v)[1];
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.appendChild(s)});
const loaded={};
async function useVersion(code){
  if(!loaded[code]){await loadScript('data-'+code+'.js');loaded[code]=1}
  const T=window['TEXT_'+code];
  BOOKS.forEach((b,i)=>{b[1]=T[i]});
  S.v=code;
}
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function show(p){closeSheet();document.body.classList.remove('hh');['read','nav','search'].forEach(x=>$(x).classList.toggle('on',x===p));window.scrollTo(0,0)}
function applyLook(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty('--fs',S.fs+'px')}
function drawChapter(){
  const [name,chs]=BOOKS[S.b],vs=chs[S.c];
  $('title').innerHTML='<span id="tt">'+name+' '+(S.c+1)+'</span><small id="tv">'+VL()+'</small>';
  let h=(store.get('hint')?'':'<div id="hint"><span>Hold your finger on any word for options.</span><button id="hintx">Got it</button></div>')
    +(S.ch?'<h1>'+name+' '+(S.c+1)+'<small>'+VL()+'</small></h1>':'');
  h+='<div class="chap '+S.layout+'">';
  vs.forEach((v,i)=>{if(v)h+='<span class="vs'+(S.hl===i+1?' hl':'')+'" id="v'+(i+1)+'" data-v="'+(i+1)+'">'+(S.vn?'<sup>'+(i+1)+'</sup>':'')+words(v)+'</span> '});
  h+='</div>';
  const pv=pageNav(-1),nx=pageNav(1),gap='<span style="flex:1"></span>';
  h+='<div class="pager">'+(pv?'<button id="prev">&larr; '+pv[0]+'<small>'+pv[1]+'</small></button>':gap)+(nx?'<button id="next">'+nx[0]+' &rarr;<small>'+nx[1]+'</small></button>':gap)+'</div>';
  $('read').innerHTML=h;
  if($('hintx'))$('hintx').onclick=()=>{store.set('hint','1');$('hint').remove()};
  if(pv)$('prev').onclick=()=>{S.hl=0;pv[2]();read()};if(nx)$('next').onclick=()=>{S.hl=0;nx[2]();read()};
}
function read(){
  drawChapter();show('read');
  if(S.hl){const e=$('v'+S.hl);if(e)e.scrollIntoView({block:'center'})}
  save();
}
function rerenderChapter(){
  let a=null,off=0;
  document.querySelectorAll('#read .vs').forEach(e=>{if(a===null){const r=e.getBoundingClientRect();if(r.bottom>96){a=e.dataset.v;off=r.top}}});
  drawChapter();
  if(a!==null){const e=$('v'+a);if(e){const r=e.getBoundingClientRect();window.scrollTo(0,Math.max(0,window.scrollY+r.top-off))}}
}
function step(d){
  S.hl=0;S.c+=d;
  if(S.c<0){if(S.b>0){S.b--;S.c=BOOKS[S.b][1].length-1}else S.c=0}
  else if(S.c>=BOOKS[S.b][1].length){if(S.b<BOOKS.length-1){S.b++;S.c=0}else S.c=BOOKS[S.b][1].length-1}
  read();
}
let navMode='books';
function renderBookList(){
  navMode='books';
  let h='<h2 style="margin-top:0">Bible version</h2><div class="vers">'+VERS.map(v=>'<button data-ver="'+v[0]+'" class="'+(v[0]===S.v?'on':'')+'">'+v[1]+'<small>'+v[2]+'</small></button>').join('')+'</div><button id="tips">How to use this app</button>';
  BOOKS.forEach((b,i)=>{
    if(i===0)h+='<h2>Old Testament</h2>';
    if(i===39)h+='<h2>New Testament</h2>';
    h+='<button data-b="'+i+'">'+b[0]+'</button>';
  });
  $('nav').innerHTML=h;
  $('nav').querySelectorAll('button[data-b]').forEach(x=>x.onclick=()=>chapterGrid(+x.dataset.b));
  $('nav').querySelectorAll('button[data-ver]').forEach(x=>x.onclick=()=>switchVersion(x.dataset.ver));
  $('tips').onclick=()=>{store.set('hint','');read()};
}
function bookList(){renderBookList();show('nav')}
function chapterGrid(i){
  navMode='grid';
  const n=BOOKS[i][1].length;
  let h='<button id="back" style="margin-bottom:12px">&larr; All books</button><h2 style="font-size:1.4rem;color:inherit">'+BOOKS[i][0]+'</h2><div class="grid">';
  for(let c=0;c<n;c++)h+='<button data-c="'+c+'">'+(c+1)+'</button>';
  $('nav').innerHTML=h+'</div>';window.scrollTo(0,0);
  $('back').onclick=bookList;
  $('nav').querySelectorAll('.grid button').forEach(x=>x.onclick=()=>{S.b=i;S.c=+x.dataset.c;S.hl=0;read()});
}
let timer;
function doSearch(){
  const words=$('q').value.toLowerCase().split(/\s+/).filter(Boolean),out=$('res');
  if(!words.length){out.innerHTML='';return}
  const hits=[];let total=0;
  for(let b=0;b<BOOKS.length;b++)BOOKS[b][1].forEach((ch,c)=>ch.forEach((v,i)=>{
    const l=(v||'').toLowerCase();
    if(v&&words.every(w=>l.includes(w))){total++;if(hits.length<150)hits.push([b,c,i,v])}
  }));
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  let h='<p class="note">'+VL()+': '+(total?total+' verse'+(total>1?'s':'')+' found'+(total>150?' (showing the first 150)':''):'No verses found. Try a different word.')+'</p>';
  hits.forEach(x=>{h+='<button class="res" data-b="'+x[0]+'" data-c="'+x[1]+'" data-v="'+(x[2]+1)+'"><b>'+BOOKS[x[0]][0]+' '+(x[1]+1)+':'+(x[2]+1)+'</b>'+esc(x[3]).replace(re,'<mark>$1</mark>')+'</button>'});
  out.innerHTML=h;
  out.querySelectorAll('.res').forEach(x=>x.onclick=()=>{S.b=+x.dataset.b;S.c=+x.dataset.c;S.hl=+x.dataset.v;read()});
}
async function switchVersion(code){
  if(code!==S.v){
    try{await useVersion(code)}catch(e){toast('Could not load that version');return}
    S.hl=0;
  }
  read();toast('Now reading the '+VL());
}
$('menu').onclick=$('title').onclick=bookList;
$('find').onclick=()=>{show('search');$('q').focus()};
$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(doSearch,250)};
$('disp').onclick=showDisplay;
const words=v=>esc(v).replace(/[A-Za-z][A-Za-z'\u2019-]*/g,'<span class="w">$&</span>');
let sel=null,lt,lx,ly,lpFired=false;
const ref=(lo,hi)=>(BOOKS[S.b][0]==='Psalms'?'Psalm':BOOKS[S.b][0])+' '+(S.c+1)+':'+(lo===hi?lo:lo+'-'+hi);
const passage=(lo,hi)=>BOOKS[S.b][1][S.c].slice(lo-1,hi).filter(Boolean).join(' ')+' \u2014 '+ref(lo,hi)+' ('+VL()+')';
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function closeSheet(){sel=null;$('sheet').className='';$('sheet').innerHTML='';document.body.classList.remove('sh');document.querySelectorAll('#read .sel,#read .wp').forEach(e=>e.classList.remove('sel','wp'))}
const paint=()=>document.querySelectorAll('#read .vs').forEach(p=>p.classList.toggle('sel',!!sel&&+p.dataset.v>=sel.lo&&+p.dataset.v<=sel.hi));
const plug=n=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n];
async function copy(t){let ok=false;try{const C=plug('Clipboard');if(C){await C.write({string:t});ok=true}else if(navigator.clipboard){await navigator.clipboard.writeText(t);ok=true}}catch(e){}
  if(!ok){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}catch(e){}}
  toast(ok?'Copied':'Could not copy')}
async function share(t){const P=plug('Share');try{if(P)return await P.share({text:t});if(navigator.share)return await navigator.share({text:t})}catch(e){return}await copy(t)}
function open(){$('sheet').className='on';document.body.classList.add('sh')}
function menu(p,word){
  sel={a:p,lo:p,hi:p};paint();
  $('sheet').innerHTML='<div class="sh-t">'+ref(p,p)+'</div><button class="big" id="m-def">Meaning of &ldquo;'+esc(word)+'&rdquo;</button><button class="big" id="m-sh">Share verse</button><button class="big" id="m-cp">Copy verse</button><button class="big" id="m-more">Select more verses</button><button class="big close" id="m-x">Close</button>';
  open();
  $('m-def').onclick=()=>define(p,word);
  $('m-sh').onclick=()=>share(passage(p,p));
  $('m-cp').onclick=()=>copy(passage(p,p));
  $('m-more').onclick=selectBar;
  $('m-x').onclick=closeSheet;
  const v=$('v'+p);if(v)v.scrollIntoView({block:'nearest',behavior:'smooth'});
}
const updRef=()=>{$('selref').textContent=ref(sel.lo,sel.hi)+' \u2014 tap verses to extend'};
function selectBar(){
  sel.on=true;
  $('sheet').innerHTML='<div class="sh-t" id="selref"></div><div class="row"><button class="big" id="s-sh">Share</button><button class="big" id="s-cp">Copy</button><button class="big close" id="s-x">Cancel</button></div>';
  $('s-sh').onclick=()=>share(passage(sel.lo,sel.hi));
  $('s-cp').onclick=()=>copy(passage(sel.lo,sel.hi));
  $('s-x').onclick=closeSheet;
  updRef();
}
let DW,DE,WM,EM;
function lookup(word){
  if(!DW){const D=window.DICT;DW=D.dw;DE=D.de;WM=D.wm;EM=D.em}
  let w=word.toLowerCase().replace(/\u2019/g,"'");
  const find=x=>{const h=WM[x]||(DW[x]?x:null),k=EM[x]||(DE[x]?x:null);return h||k?{gen:h?DW[h]:null,bib:k?DE[k]:null}:null};
  return find(w)||find(w.replace(/'s$/,''))||{gen:null,bib:null};
}
async function define(p,word){
  if(!window.DICT){
    $('sheet').innerHTML='<div class="sh-t">Loading the dictionary…</div>';open();
    try{await loadScript('data-dict.js')}catch(e){
      $('sheet').innerHTML='<div class="sh-t">The dictionary could not be loaded.</div><div class="row"><button class="big" id="d-back">Back</button><button class="big close" id="d-x">Close</button></div>';
      $('d-back').onclick=()=>menu(p,word);$('d-x').onclick=closeSheet;return}
    if($('sheet').className!=='on')return;
  }
  const r=lookup(word);let tab=r.bib&&!r.gen?'bib':'gen';
  const draw=()=>{
    const both=r.gen&&r.bib,body=tab==='bib'?r.bib&&('<small>Bible Dictionary (Easton, 1897)</small>'+esc(r.bib[1])):r.gen&&('<small>Dictionary (Webster, 1828)</small>'+esc(r.gen));
    $('sheet').innerHTML='<div class="sh-t">&ldquo;'+esc(word)+'&rdquo;</div>'
      +(both?'<div class="tabs"><button class="big'+(tab==='gen'?' on':'')+'" id="t-g">Word meaning</button><button class="big'+(tab==='bib'?' on':'')+'" id="t-b">Bible dictionary</button></div>':'')
      +'<div class="def">'+(body||'No entry was found for this word.')+'</div>'
      +'<div class="row"><button class="big" id="d-back">Back</button><button class="big close" id="d-x">Close</button></div>';
    open();
    if(both){$('t-g').onclick=()=>{tab='gen';draw()};$('t-b').onclick=()=>{tab='bib';draw()}}
    $('d-back').onclick=()=>menu(p,word);$('d-x').onclick=closeSheet;
  };
  draw();
}
function refreshScreen(){
  if($('read').classList.contains('on'))rerenderChapter();
  else if($('nav').classList.contains('on')){if(navMode==='books')renderBookList()}
  else if($('search').classList.contains('on'))doSearch();
}
function showDisplay(){closeSheet();drawDisplay();open()}
function drawDisplay(){
  const seg=(items,cur,attr)=>'<div class="row">'+items.map(x=>'<button class="big'+(x[0]===cur?' on':'')+'" '+attr+'="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  $('sheet').innerHTML='<div class="sh-t">Display</div><div class="dsp">'
    +'<div class="dl">Text size</div><div class="row"><button class="big" id="dp-sm" aria-label="Smaller text">A&minus;</button><div class="szv">'+S.fs+'</div><button class="big" id="dp-bg" aria-label="Larger text">A+</button></div>'
    +'<div class="dl">Theme</div>'+seg([['day','Day'],['night','Night']],S.theme,'data-th')
    +'<div class="dl">Layout</div>'+seg([['lines','One verse per line'],['para','Paragraph']],S.layout,'data-lay')
    +'<div class="dl">Show</div><div class="row"><button class="big'+(S.vn?' on':'')+'" id="dp-vn">Verse numbers: '+(S.vn?'On':'Off')+'</button><button class="big'+(S.ch?' on':'')+'" id="dp-ch">Chapter heading: '+(S.ch?'On':'Off')+'</button></div>'
    +'<div class="dl">Bible version</div>'+seg(VERS.map(v=>[v[0],v[1]]),S.v,'data-dv')
    +'</div><button class="big close" id="dp-x">Close</button>';
  $('dp-sm').onclick=()=>setPref('fs',Math.max(16,S.fs-2));
  $('dp-bg').onclick=()=>setPref('fs',Math.min(48,S.fs+2));
  $('sheet').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>setPref('theme',b.dataset.th));
  $('sheet').querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>setPref('layout',b.dataset.lay));
  $('dp-vn').onclick=()=>setPref('vn',!S.vn);
  $('dp-ch').onclick=()=>setPref('ch',!S.ch);
  $('sheet').querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>dispVersion(b.dataset.dv));
  $('dp-x').onclick=closeSheet;
}
function setPref(k,v){S[k]=v;save();applyLook();refreshScreen();drawDisplay()}
async function dispVersion(code){
  if(code!==S.v){
    try{await useVersion(code)}catch(e){toast('Could not load that version');return}
    S.hl=0;
  }
  save();refreshScreen();
  if($('sheet').className==='on'&&$('dp-x'))drawDisplay();
}
const rd=$('read');
rd.addEventListener('touchstart',e=>{
  lpFired=false;
  const w=e.target.closest&&e.target.closest('.w');if(!w||(sel&&sel.on))return;
  const t=e.touches[0];lx=t.clientX;ly=t.clientY;
  lt=setTimeout(()=>{lpFired=true;w.classList.add('wp');if(navigator.vibrate)navigator.vibrate(30);menu(+w.closest('.vs').dataset.v,w.textContent)},500);
},{passive:true});
rd.addEventListener('touchmove',e=>{const t=e.touches[0];if(Math.abs(t.clientX-lx)>10||Math.abs(t.clientY-ly)>10)clearTimeout(lt)},{passive:true});
['touchend','touchcancel'].forEach(n=>rd.addEventListener(n,()=>clearTimeout(lt)));
rd.addEventListener('contextmenu',e=>e.preventDefault());
rd.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  if(!sel||!sel.on){if(document.body.classList.contains('hh')&&!e.target.closest('button'))document.body.classList.remove('hh');return}
  const p=e.target.closest('.vs');if(!p)return;
  const v=+p.dataset.v;sel.lo=Math.min(sel.a,v);sel.hi=Math.max(sel.a,v);paint();updRef();
});
try{const A=plug('App');if(A)A.addListener('backButton',()=>{if($('sheet').className==='on')closeSheet();else if(!$('read').classList.contains('on'))read();else A.exitApp()})}catch(e){}
function pageNav(d){
  const nm=BOOKS[S.b][0],last=BOOKS[S.b][1].length-1;
  if(d<0){
    if(S.c>0)return['Previous chapter',nm+' '+S.c,()=>{S.c--}];
    if(S.b>0)return['Previous book',BOOKS[S.b-1][0],()=>{S.b--;S.c=0}];
    return null}
  if(S.c<last)return['Next chapter',nm+' '+(S.c+2),()=>{S.c++}];
  if(S.b<BOOKS.length-1)return['Next book',BOOKS[S.b+1][0],()=>{S.b++;S.c=0}];
  return null}
let sy=0;
addEventListener('scroll',()=>{
  const y=window.scrollY,b=document.body.classList;
  if(!$('read').classList.contains('on')||y<80)b.remove('hh');else if(y>sy+6)b.add('hh');
  sy=y},{passive:true});
$('read').innerHTML='<p style="font-size:1.2rem">Loading…</p>';
applyLook();
useVersion(S.v).catch(()=>{S.v='kjv';return useVersion('kjv')})
  .then(()=>{if(!BOOKS[S.b]||!BOOKS[S.b][1][S.c]){S.b=42;S.c=0}read()})
  .catch(()=>{$('read').innerHTML='<p style="font-size:1.2rem">The Bible text could not be loaded. Please reinstall the app.</p>'});
</script>
</body>
</html>
